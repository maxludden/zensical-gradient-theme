{#- Gradient theme: extends the built-in Zensical (Material) templates and adds
    the theme stylesheet and script, so projects need no extra_css/extra_javascript. -#}
{% extends "base.html" %}

{% block styles %}
  {{ super() }}
  <link rel="stylesheet" href="{{ 'assets/stylesheets/gradient.css' | url }}">
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script src="{{ 'assets/javascripts/gradient.js' | url }}"></script>
{% endblock %}
