# Defaults for the "gradient" theme. Zensical merges a project's own `theme`
# settings over these one key at a time, so setting `palette` or `features` in a
# project replaces the whole list below rather than adding to it.
extends: material

variant: classic

font:
  text: Inter
  code: Roboto Mono

palette:
  - media: "(prefers-color-scheme)"
    scheme: gradient-dark
    primary: custom
    accent: custom
    toggle:
      icon: lucide/sun-moon
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: gradient-light
    primary: custom
    accent: custom
    toggle:
      icon: lucide/sun
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: gradient-dark
    primary: custom
    accent: custom
    toggle:
      icon: lucide/moon
      name: Switch to system preference

features:
  - navigation.instant
  - navigation.instant.prefetch
  - navigation.instant.progress
  - navigation.tracking
  - navigation.sections
  - navigation.path
  - navigation.top
  - navigation.footer
  - toc.follow
  - search.suggest
  - search.highlight
  - content.code.annotate
  - content.code.copy
  - content.tabs.link
