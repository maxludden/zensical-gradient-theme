# Demo site for previewing the theme: `uv run zensical serve`.
[project]
site_name = "Zensical Gradient Theme"
site_description = "Preview of the zensical-gradient-theme."
site_url = "https://maxludden.github.io/zensical-gradient-theme/"
repo_name = "zensical-gradient-theme"
repo_url = "https://github.com/maxludden/zensical-gradient-theme"
nav = [
    { "Home" = "index.md" },
    { "Installation" = "installation.md" },
    { "Getting Started" = "getting-started.md" },
]

[project.theme]
name = "gradient"
# Logo and favicon for this repo's docs only; not shipped with the theme.
logo = "img/logo.svg"
favicon = "img/logo.svg"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.keys]
