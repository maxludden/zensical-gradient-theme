          repeatCount="indefinite" />
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="20s"
        repeatCount="indefinite" />
    </linearGradient>
    <linearGradient id="logo-gradient-b" gradientUnits="objectBoundingBox" x1="0" y1="1" x2="1" y2="1">
