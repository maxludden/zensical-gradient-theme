    <style>
      /* Light variant: fixed colors so the docs theme toggle, not the
         reader's system setting, decides which banner shows. */
      :root {
        --text-color: #353535;
      }

      .cls-1 {
        fill: none;
      }

      .cls-2 {
        fill: url(#logo-gradient-a);
      }

      .cls-2b {
        fill: url(#logo-gradient-b);
      }

      @media (prefers-reduced-motion: reduce) {

        animate,
        animateTransform {
          display: none;
        }
      }

      .cls-3 {
        fill: url(#linear-gradient-3);
      }

      .cls-4 {
        fill: url(#linear-gradient-2);
      }

      .cls-5 {
        fill: url(#linear-gradient);
      }

      .cls-6 {
