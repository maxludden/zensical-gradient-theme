          values="#af00ff;#5f00ff;#0088ff;#00ffff;#00ff00;#99ff00;#ffff00;#ff8800;#ff0000;#ff00ff;#af00ff" dur="20s"
          repeatCount="indefinite" />
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" values="360 .5 .5;0 .5 .5" dur="20s"
        repeatCount="indefinite" />
    </linearGradient>
